services:
  postgres:
    image: postgres:17
    container_name: postgres_picsail_dev
    environment:
      POSTGRES_USER: picsail
      POSTGRES_PASSWORD: picsail
      POSTGRES_DB: picsail
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_picsail_dev
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
