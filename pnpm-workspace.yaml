allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.1'
  - '@tanstack/query-devtools@5.105.1'
  - '@tanstack/react-query-devtools@5.105.1'
  - '@tanstack/react-query@5.105.1'
